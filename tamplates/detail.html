<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pay</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body style="font-family:sans-serif;padding:15px">
<a href="/">← Back</a>
<img src="{{c[6]}}" style="width:100%;border-radius:10px">
<h2>{{c[1]}} - Rs.{{c[5]}}</h2>
<form id="payform" method="POST" action="/pay/{{c[0]}}">
<input name="buyer_name" placeholder="Your Name" required style="padding:10px;width:90%"><br><br>
<input name="buyer_phone" placeholder="Phone" required style="padding:10px;width:90%"><br><br>
<button type="submit" style="padding:15px;width:95%;background:green;color:white;border:none;border-radius:8px;font-size:18px">Pay Token Rs.{{ (c[5]*0.05)|int }} - Auto Confirm</button>
</form>
<p><small>Paisa direct tumhare Razorpay account me ayega. No admin needed.</small></p>
</body></html>
