<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin</title></head>
<body style="font-family:sans-serif;margin:0">
<div style="background:black;color:white;padding:12px">
<a href="/" style="color:white;text-decoration:none">Home</a> | Admin Dashboard
</div>
<div style="padding:15px">
<h2>Commission Dashboard</h2>
<div style="background:black;color:white;padding:15px;border-radius:10px">
Total Profit: <b style="color:lime;font-size:20px">Rs. {{total}}</b><br>
Total Deals: {{deals|length}}
</div>
{% for d in deals %}
<div style="border:1px solid #000;padding:10px;margin:8px 0">
#{{d[0]}} | Container {{d[1]}} | {{d[2]}} ({{d[3]}})<br>
Sale Rs.{{d[4]}} + Fee Rs.{{d[5]}} | Seller Gets Rs.{{d[8]}} | <b style="color:green">Profit Rs.{{d[9]}}</b>
</div>
{% endfor %}
</div>
</body>
</html>
