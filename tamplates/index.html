<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container-HUB - Bhiwandi</title>
</head>
<body style="font-family:sans-serif;margin:0;background:#f5f5f5">

<div style="background:black;color:white;padding:12px;display:flex;gap:15px;position:sticky;top:0">
<a href="/" style="color:white;text-decoration:none;font-weight:bold">Container-HUB</a>
<a href="/seller" style="color:white;text-decoration:none">Sell</a>
<a href="/my-orders" style="color:white;text-decoration:none">My Orders</a>
<a href="/admin?password=admin123" style="color:yellow;text-decoration:none">Admin</a>
</div>

<div style="padding:15px">
<h2>Available Containers in Bhiwandi</h2>

<form method="GET" style="margin-bottom:15px">
<input name="q" placeholder="Search Bhiwandi, 20ft..." style="padding:8px;width:200px">
<button style="padding:8px 12px;background:black;color:white">Search</button>
</form>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
{% for c in containers %}
<a href="/detail/{{c[0]}}" style="text-decoration:none;color:black">
<div style="background:white;border-radius:10px;overflow:hidden;border:1px solid #ddd">
<img src="{{c[6]}}" style="width:100%;height:120px;object-fit:cover">
<div style="padding:8px">
<b>{{c[1]}}</b><br>
<small>{{c[2]}} - {{c[3]}} {{c[4]}}</small><br>
<b style="color:green">Rs.{{c[5]}}</b>
</div>
</div>
</a>
{% else %}
<p>No containers available. Seller pe jaake add karo.</p>
{% endfor %}
</div>
</div>

</body>
  </html>
